<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ファミリーツリー｜規約とプライバシーポリシー｜株式会社ブリッジ">
<title>ファミリーツリー 規約とポリシー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap">
<style>
  :root {
    --bg:      #fdfaf5;
    --surface: #ffffff;
    --fg:      #2e2a24;
    --muted:   #6f6659;
    --accent:  #4f8c64;
    --rule:    #e7dfd2;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans:  "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --surface: #252220; --fg: #ece6dc;
      --muted: #a79c8c; --accent: #8cc79f; --rule: #3a352e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --surface: #252220; --fg: #ece6dc;
    --muted: #a79c8c; --accent: #8cc79f; --rule: #3a352e;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--sans); font-size: 15px; line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 36rem; margin-inline: auto;
    padding-block: 4.5rem 5rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .eyebrow {
    font-size: .74rem; letter-spacing: .18em; color: var(--accent);
    font-weight: 700; margin: 0 0 .7rem;
  }
  h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(1.5rem, 5vw, 1.95rem); line-height: 1.5;
    margin: 0 0 .8rem; text-wrap: balance;
  }
  .lede { color: var(--muted); margin: 0 0 2.6rem; font-size: .92rem; }
  .docs { display: grid; gap: .9rem; }
  a.doc {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 10px; padding: 1.2rem 1.3rem;
    transition: border-color .15s ease;
  }
  a.doc:hover, a.doc:focus-visible { border-color: var(--accent); }
  a.doc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.doc .t {
    font-family: var(--serif); font-weight: 600; font-size: 1.05rem;
    display: block; margin-bottom: .2rem;
  }
  a.doc .d { color: var(--muted); font-size: .86rem; }
  footer {
    margin-top: 3.5rem; padding-top: 1.3rem;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: .84rem;
  }
  .mail { color: var(--accent); font-weight: 700; user-select: all; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">FAMILY TREE</p>
  <h1>規約とポリシー</h1>
  <p class="lede">
    アプリケーション「ファミリーツリー」の利用条件と、個人情報の取扱いについて定めた文書です。
  </p>

  <div class="docs">
    <a class="doc" href="terms.html">
      <span class="t">利用規約</span>
      <span class="d">本アプリの利用条件、ご家族の情報を登録する際の責任、送金機能の取扱いについて</span>
    </a>
    <a class="doc" href="privacy.html">
      <span class="t">プライバシーポリシー</span>
      <span class="d">取得する情報、利用目的、保存先、アカウント削除の方法について</span>
    </a>
  </div>

  <footer>
    <p style="margin:0 0 .3rem">株式会社ブリッジ</p>
    <p style="margin:0">お問い合わせ：<span class="mail">office@bridge-online.net</span></p>
  </footer>
</div>
</body>
</html>
